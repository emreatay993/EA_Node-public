[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skf-engineering-bearing-suite"
version = "1.0.0"
description = "SKF-style bearing friction, drag, thermal and rating-life calculation suite with a PyQt6 engineering GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Emre"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "numba>=0.58",
  "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
skf-bearing = "skfcalc.cli:main"
skf-bearing-gui = "skfcalc.gui:main"
skf-bearing-benchmark = "skfcalc.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skfcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
